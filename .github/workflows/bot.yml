# BTC 5분봉 가상 매매 봇 — 실제 주문 없음, 공개 시세만 조회
# GitHub의 5분 예약 실행은 자주 늦거나 시작되지 않아서, 한 번 실행되면
# 약 5시간 40분 동안 '5분봉이 닫힐 때마다(+20초)' 봇을 돌리고,
# 끝나기 직전에 다음 실행을 스스로 이어서 예약한다. 15분 예약은 비상용.
name: BTC 가상 매매 봇

on:
  schedule:
    - cron: "*/15 * * * *"      # 비상용 (돌고 있는 실행이 있으면 대기했다가 이어받음)
  workflow_dispatch: {}         # Actions 탭에서 수동 실행 / 이전 실행이 이어서 예약

permissions:
  contents: write               # data/·ledger/·state/ 커밋·푸시
  actions: write                # 다음 실행 이어서 예약

concurrency:
  group: btc-paper-bot          # 동시에 하나만 실행
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: 파이썬 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 5분봉 마감마다 봇 실행 (약 5시간 40분)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Seoul
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          while :; do
            git pull --rebase --autostash -q || echo "pull 실패 — 이번엔 그대로 진행"
            python bot.py || echo "봇 실행 실패 — 다음 봉에서 다시 시도"
            for p in data ledger state config.json research/v4; do
              if [ -e "$p" ]; then git add "$p"; fi
            done
            if ! git diff --cached --quiet; then
              git commit -q -m "봇 장부 업데이트 $(date '+%Y-%m-%d %H:%M') KST [skip ci]"
              for i in 1 2 3; do
                if git pull --rebase --autostash -q && git push -q; then break; fi
                sleep 5
              done
            fi
            now=$(date +%s)
            next=$(( (now / 300 + 1) * 300 + 20 ))   # 다음 5분봉 마감 + 20초
            if [ "$next" -ge "$end" ]; then break; fi
            sleep $(( next - now ))
          done
          gh workflow run bot.yml --ref main || echo "다음 실행 예약 실패 — 15분 비상 예약이 이어받음"
